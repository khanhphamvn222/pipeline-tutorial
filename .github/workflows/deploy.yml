name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies and build site
        run: |
          mkdir -p build
          cat << 'EOF' > build/index.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Bài 6: Bảo mật với DevSecOps - Phạm Duy Khánh</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 40px; background: #0f172a; color: #f8fafc; text-align: center; }
              .card { max-width: 700px; margin: 50px auto; background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
              h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 8px; }
              .badge { display: inline-block; padding: 6px 14px; background: #22c55e; color: #000; font-weight: bold; border-radius: 20px; font-size: 0.9rem; margin: 15px 0; }
              p { line-height: 1.6; font-size: 1.1rem; color: #94a3b8; }
              .info { background: #0f172a; padding: 15px; border-radius: 8px; margin: 20px 0; border-left: 4px solid #38bdf8; text-align: left; }
              .info p { margin: 6px 0; color: #e2e8f0; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Bài 6: Bảo Mật Với DevSecOps</h1>
              <div class="badge">CI/CD Pipeline: SUCCESS</div>
              <div class="info">
                <p>👤 <strong>Sinh viên:</strong> Phạm Duy Khánh</p>
                <p>🆔 <strong>MSSV:</strong> 2387700029</p>
                <p>📚 <strong>Môn học:</strong> Thực hành Lý thuyết An toàn thông tin (TH_LT_ANTT)</p>
                <p>🚀 <strong>Nền tảng:</strong> GitHub Actions & GitHub Pages</p>
              </div>
              <p>Trang web tài liệu được tự động hóa quy trình xây dựng (Build), đóng gói (Artifacts) và phát hành (Deploy) thông qua hệ thống CI/CD Pipeline an toàn.</p>
            </div>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
